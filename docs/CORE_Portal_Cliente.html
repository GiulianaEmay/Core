<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORE · Portal del cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#070F38;--navy2:#0E1B55;--line2:#22307A;--blue:#1B4CF0;--blue2:#0F35B8;--cyan:#00D2F5;
  --bg:#F3F5FA;--card:#FFFFFF;--line:#E3E7F0;--line3:#EEF1F7;--txt:#0E1433;--mut:#5A6386;--mut2:#7F8BB8;
  --green:#1F8F4E;--green-bg:#E3F5EA;--green-tx:#176B3C;
  --amber:#E08A00;--amber-bg:#FFE9C2;--amber-tx:#7A4A00;
  --red:#C62E45;--red-bg:#FDE7EA;--red-tx:#B42339;
  --blue-bg:#E8EEFF;--grey-bg:#EEF1F7;
  --fin:#8A5A00;--fin-bg:#FFF3D6;--ope:#176B3C;--ope-bg:#E3F5EA;--leg:#5B3BB0;--leg-bg:#EFE8FC;
  --disp:'Saira',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}a:hover{color:var(--blue2)}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .brand{background:var(--navy);color:#fff;padding:56px 64px;display:flex;flex-direction:column;gap:28px}
.logo{font-family:var(--disp);font-weight:800;letter-spacing:.55em;color:#fff}
.tag{font-size:12px;letter-spacing:.08em;color:var(--mut2)}
.login h1{font-family:var(--disp);font-size:48px;line-height:1.05;font-weight:700;margin-top:40px}
.login h1 span{color:var(--cyan)}
.login p.lead{font-size:16px;line-height:1.6;color:#B9C2E4;max-width:520px}
.steps5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;list-style:none}
.steps5 li{border-top:2px solid var(--blue);padding-top:10px;font-size:12.5px;color:#D5DBF2}
.steps5 b{display:block;font-family:var(--disp);color:var(--cyan)}
.login .formside{display:flex;align-items:center;justify-content:center;padding:24px}
.lform{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:14px}
.lform h2{font-family:var(--disp);font-size:26px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.in{height:46px;border:1px solid #D5DBEA;border-radius:10px;padding:0 14px;font-size:14px;background:#fff;outline:none}
.in:focus{border-color:var(--blue)}
textarea.in{height:auto;padding:10px 14px;resize:vertical}
.btn{height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--blue2)}
.btn.ok{background:var(--green)}.btn.ok:hover{background:#17733F}
.btn.line{background:#fff;border:1px solid #D5DBEA;color:var(--txt)}.btn.line:hover{border-color:var(--blue)}
.btn.warn{background:#fff;border:1px solid #B86E00;color:#8A5200}
.btn.sm{height:38px;padding:0 14px;font-size:13px}
.err{color:var(--red-tx);font-size:13px;min-height:18px}
.hint{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--mut);line-height:1.5}
/* app */
.app{display:flex;min-height:100vh}
.side{width:252px;flex-shrink:0;background:var(--navy);color:#B9C2E4;padding:22px 14px 18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .grp{font-size:10.5px;font-weight:600;letter-spacing:.14em;color:#6874A6;padding:8px 12px 4px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#B9C2E4;text-decoration:none;cursor:pointer;background:none;border:0;width:100%;text-align:left;font-size:13.5px}
.nav:hover{color:#fff;background:#0E1B55}
.nav.on{background:var(--blue);color:#fff;font-weight:600}
.nav .b{margin-left:auto;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;background:var(--amber);color:#1A1200}
.nav .b.r{background:var(--red);color:#fff}
.nav svg{flex-shrink:0}
.chip-a{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.clientcard{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy2);border:1px solid var(--line2);border-radius:12px;color:#fff}
.clientcard .av{width:34px;height:34px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:13px}
.main{flex-grow:1;min-width:0;padding:22px 30px 48px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.top .t{flex-grow:1;display:flex;flex-direction:column;gap:3px;min-width:260px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;color:#0A6F8F;text-transform:uppercase}
h1.h{font-family:var(--disp);font-size:27px;font-weight:700}
.sub{font-size:13.5px;color:var(--mut)}
.sel{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
.sel select{height:40px;border:1px solid #D5DBEA;border-radius:10px;padding:0 12px;background:#fff;font-size:13px;min-width:230px}
.user{display:flex;align-items:center;gap:10px}
.user .av{width:40px;height:40px;border-radius:50%;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700}
.menu-btn{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{font-family:var(--disp);font-size:17px;font-weight:700}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.dark{background:var(--navy);color:#fff;border:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.5fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.kpi .v{font-family:var(--disp);font-size:24px;font-weight:700;line-height:1.15}
.kpi .v.pm{color:#9AA3C4;font-size:18px}
.kpi .s{font-size:12px;color:var(--mut);line-height:1.4}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:3px 9px;white-space:nowrap}
.p-verde{background:var(--green-bg);color:var(--green-tx)}.p-ambar{background:var(--amber-bg);color:var(--amber-tx)}.p-rojo{background:var(--red-bg);color:var(--red-tx)}.p-gris{background:var(--grey-bg);color:var(--mut)}.p-azul{background:var(--blue-bg);color:var(--blue)}.p-solid{background:var(--green);color:#fff}.p-navy{background:var(--navy);color:#fff}
.a-Finanzas{background:var(--fin-bg);color:var(--fin)}.a-Operaciones{background:var(--ope-bg);color:var(--ope)}.a-Legal{background:var(--leg-bg);color:var(--leg)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.d-rojo{background:var(--red)}.d-ambar{background:var(--amber)}.d-verde{background:var(--green)}.d-gris{background:#C3CAE0}.d-azul{background:var(--blue)}
.bar{height:6px;border-radius:4px;background:var(--line3);overflow:hidden;flex-grow:1}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.row{display:flex;gap:12px;align-items:center}
.list .it{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line3)}
.list .it:first-child{border-top:0}
.it .tx{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.it .tx b{font-size:13.5px}.it .tx span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{height:44px;padding:0 16px;border:0;background:transparent;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:14px}
.tab.on{color:var(--navy);font-weight:700;border-bottom-color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipf{height:34px;padding:0 14px;border-radius:17px;border:1px solid #D5DBEA;background:#fff;cursor:pointer;font-size:13px}
.chipf.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.seg{display:flex;background:var(--line);border-radius:12px;padding:4px}
.seg button{height:34px;padding:0 18px;border-radius:9px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--txt);font-weight:700}
.tbl{width:100%;font-size:13px}
.tr{display:grid;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line3)}
.tr.th{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--mut);border-top:0;padding-top:4px;text-transform:uppercase}
.muted{color:var(--mut)}
.note{background:#E0F6FB;color:#0A5E78;border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.5}
.banner{display:flex;gap:14px;align-items:center;border-radius:14px;padding:14px 18px}
.empty{color:var(--mut);text-align:center;padding:26px 0}
.fase{border-top:1px solid var(--line);padding:14px 0 6px}
.fase .fh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fase .fh b{font-family:var(--disp);font-size:15px}
.gtrack{position:relative;height:24px;border-radius:6px;background:#F6F8FC}
.gbar{position:absolute;top:4px;bottom:4px;border-radius:5px}
.gtoday{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--red)}
.gmonths{display:grid;font-size:11.5px;font-weight:600;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}.login .brand{padding:32px 20px}.login h1{font-size:34px;margin-top:10px}.steps5{grid-template-columns:repeat(2,1fr)}
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .main{padding:16px}
  .g6,.g4{grid-template-columns:1fr 1fr}
  .tr{grid-template-columns:1fr!important}.tr.th{display:none}
  .sel select{min-width:0;width:100%}
}

/* v2 */
.menu-btn{display:inline-flex!important;width:40px;padding:0;flex-shrink:0}
.top{flex-wrap:nowrap;align-items:center}.top .t{min-width:0}.top .t .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1100px){.top{flex-wrap:wrap}.top .t .sub{white-space:normal}}
.app.nos .side{display:none}
.side .x{margin-left:auto;background:none;border:0;color:#7F8BB8;cursor:pointer;padding:6px;border-radius:8px;font-size:18px;line-height:1}
.side .x:hover{background:#0E1B55;color:#fff}
.h2{font-family:var(--disp);font-size:18px;font-weight:700}
.diag{display:flex;align-items:center;gap:22px;padding:12px 18px;flex-wrap:wrap}
.dg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:190px;text-decoration:none;color:inherit;padding:4px 0}
.dg:hover .pill{filter:brightness(.97)}
.kc{gap:8px;min-width:0}
.kc.wide{grid-column:span 2}
.homeg .hbr{grid-template-columns:minmax(0,78px) minmax(40px,1fr) auto}
.kc .v small{font-size:13px;font-weight:500;color:#B9C2E4;margin-left:4px}
.kc.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.kc:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ring{flex-shrink:0}
.user,.user .av{flex-shrink:0}.user b{white-space:nowrap}
.src{display:block;font-size:11.5px;color:var(--mut2);border-top:1px solid var(--line3);padding-top:6px;margin-top:auto}
.clamp1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hb,.cmp,.effl{display:flex;flex-direction:column;gap:7px}
.hbr{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.cmp .hbr{grid-template-columns:minmax(0,1fr) auto}
.effl .hbr{grid-template-columns:minmax(0,150px) minmax(0,1fr) auto}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.hbt{position:relative;height:12px;border-radius:6px;background:var(--line3)}
.hbt>i{display:block;height:100%;border-radius:6px;min-width:3px}
.hbt>em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy)}
.hbt.ghostt{background:repeating-linear-gradient(90deg,#E3E7F0 0 6px,transparent 6px 12px)}
.hbv{font-size:12.5px;white-space:nowrap}
.hbref{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:6px}.hbref em{width:2px;height:12px;background:var(--navy)}
.cmpg{display:flex;flex-direction:column;gap:5px}
.cmpl{font-size:12px;font-weight:600;color:var(--mut)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);align-items:center}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ghost{position:relative;height:64px;border-radius:10px;background:#FAFBFE;border:1px dashed #D5DBEA;overflow:hidden}
.ghost svg{position:absolute;inset:6px 8px;width:calc(100% - 16px);height:calc(100% - 12px)}
.ghost span{position:absolute;left:10px;bottom:6px;right:10px;font-size:11px;color:var(--mut);background:rgba(250,251,254,.85);border-radius:6px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sti{width:34px;height:34px;border-radius:50%;border:2.5px solid;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.it.compact{padding:8px 0}
.more{display:block;margin-top:8px;font-size:13px;font-weight:600}
.avr{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 40px 104px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line3)}
.avr:first-of-type{border-top:0}
.statusbar{padding:12px 18px;display:flex;flex-direction:column;gap:8px}
.sbar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--line3)}
.sbar i{display:block}
.prio{display:flex;flex-direction:column;gap:5px;font-size:13px;margin-bottom:10px}
.ftbl{max-height:40vh;overflow-y:auto}
.ftbl .th{position:sticky;top:0;background:#fff;z-index:1}
.lockbar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#FFF7E6;border-color:#F4D69A;flex-wrap:wrap}
.locked{position:relative;filter:saturate(.3);opacity:.55;pointer-events:none;user-select:none}
.proj{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line3)}
.proj .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.proj b{font-size:13px}.proj .tx span{font-size:11.5px;color:var(--mut)}
.pn{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:700 12px var(--disp);flex-shrink:0}
.valco{background:var(--navy);border:0;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.valco .ghost{background:#0E1B55;border-color:#22307A}.valco .ghost span{background:rgba(14,27,85,.9);color:#B9C2E4}
.valrange{display:flex;flex-direction:column;gap:10px}
.nav .lk{margin-left:auto;font-size:10px;font-weight:700;border-radius:8px;padding:1px 7px;background:#13205F;color:#00D2F5}
@media (max-width:1100px){.kc.wide{grid-column:span 2}.valco{grid-template-columns:1fr}}
@media (max-width:860px){.app.nos .side{display:flex}.kc.wide{grid-column:auto}.g3{grid-template-columns:1fr}.avr{grid-template-columns:minmax(0,1fr) 70px 40px 90px}.hbr,.effl .hbr{grid-template-columns:minmax(0,90px) minmax(0,1fr) auto}}
@media (max-width:520px){.g4,.g6{grid-template-columns:1fr}.kc.wide{grid-column:auto}}

.srvc{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;min-height:210px;transition:border-color .15s,box-shadow .15s}
.srvc:hover{border-color:var(--blue);box-shadow:0 4px 18px rgba(27,76,240,.08);color:inherit}
.srvi{width:38px;height:38px;border-radius:10px;background:var(--navy);color:var(--cyan);display:inline-flex;align-items:center;justify-content:center;font:700 18px var(--disp);flex-shrink:0}
.srvh{font-size:12.5px;font-weight:600;color:#0A6F8F;background:#E0F6FB;border-radius:8px;padding:6px 10px}
.calc{display:flex;flex-direction:column;gap:12px}
.bigout{font-family:var(--disp);font-size:34px;font-weight:700;margin:6px 0}.bigout small{font-size:14px;color:var(--mut);font-weight:500}
.orow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line3);font-size:13px}.orow.st{font-weight:700}
#calcOut{display:flex;flex-direction:column;gap:4px;align-self:start}
.hook{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #BFE9F3;border-left:4px solid var(--cyan);border-radius:12px;padding:10px 16px;text-decoration:none;color:inherit}
.hook:hover{border-color:var(--blue);color:inherit}

.anhero{background:var(--navy);border:0;display:grid;grid-template-columns:1.3fr 1fr 1fr 1.4fr;gap:22px;align-items:center}
.anfig{display:flex;flex-direction:column;gap:4px;border-left:1px solid #1F2C70;padding-left:20px;color:#B9C2E4;font-size:12px}
.anfig .l{color:#00D2F5;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.anfig b{font-family:var(--disp);font-size:28px;color:#fff}
.anfig ol{margin:2px 0 0 18px;color:#D5DBF2;font-size:12.5px;display:flex;flex-direction:column;gap:4px}.anfig ol b{font-family:var(--body);font-size:12.5px}
.lev input[type=range]{width:100%;accent-color:var(--blue)}
.levv{font-family:var(--disp);font-size:24px}
.stk{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px}
.stk i{display:block}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#fff;font-size:13px;margin-top:6px}
.formula span{background:#13205F;border-radius:8px;padding:6px 10px}.formula b{color:#00D2F5;font-size:16px}
@media (max-width:1100px){.anhero{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.anhero{grid-template-columns:1fr}.anfig{border-left:0;padding-left:0;border-top:1px solid #1F2C70;padding-top:10px}}
.grid>*{min-width:0}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================================
   CORE · Portal del cliente
   Los datos reales están en DATA (generado desde el tablero de Pollitos de Oro
   y la propuesta a Rapesa). Para conectar con la hoja de Google, reemplace

  if (f.prob === 'Alta' && f.monto && f.monto > 20000) return ['rojo', 'Alto'];
  if (f.prob === 'Alta') return ['ambar', f.monto ? 'Medio' : 'Alto · por valorizar'];

}
function faseAtrasada(f) { return f.fin && pd(f.fin) < HOY && ['Aprobado', 'No programado'].indexOf(f.gate) < 0; }
function slaSol(s) {
  var lim = addDays(s.fecha, s.plazo);

/* ---------- gráficas (SVG y HTML, sin librerías externas) ---------- */
var COL = { rojo: 'var(--red)', ambar: 'var(--amber)', verde: 'var(--green)', azul: 'var(--blue)', gris: '#B9C1D9' };
function ring(p, est, size, label) {
  size = size || 76; var r = size / 2 - 7, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, p));
  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' + esc(label || (p + '%')) + '">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--line3)" stroke-width="8"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (COL[est] || est) + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (c * v / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
    '<text x="50%" y="50%" dy=".35em" text-anchor="middle" style="font:700 ' + Math.round(size / 4.6) + 'px var(--disp);fill:var(--txt)">' + (p % 1 && p < 10 ? p.toFixed(1) : Math.round(p)) + '%</text></svg>';
}
function fmtN(v, unit) { if (unit === 'S/') return v >= 1e6 ? 'S/ ' + (v / 1e6).toFixed(2) + ' M' : soles(v); if (unit === '%') return v.toFixed(1) + '%'; return String(v); }
/* barras horizontales: rows [[label, valor, color]] ; ref {v, l} */
function hbars(rows, unit, ref) {
  var max = Math.max.apply(null, rows.map(function (r) { return r[1]; }).concat(ref ? [ref.v] : [])) || 1;
  var h = '<div class="hb">';
  rows.forEach(function (r) {
    h += '<div class="hbr"><span class="hbl" title="' + esc(r[0]) + '">' + esc(r[0]) + '</span><span class="hbt"><i style="width:' + (r[1] / max * 100).toFixed(1) + '%;background:' + (r[2] || 'var(--blue)') + '"></i>' +
      (ref ? '<em style="left:' + (ref.v / max * 100).toFixed(1) + '%"></em>' : '') + '</span><b class="hbv">' + fmtN(r[1], unit) + '</b></div>';
  });
  if (ref) h += '<div class="hbref"><em></em>' + esc(ref.l) + '</div>';
  return h + '</div>';
}
/* comparación agrupada: series [[nombre,{ruc:v},color]] */
function cmpChart(series, rucs) {
  var max = 0; series.forEach(function (s) { rucs.forEach(function (r) { if (s[1][r] != null) max = Math.max(max, s[1][r]); }); });
  var h = '<div class="cmp">';
  rucs.forEach(function (r) {
    h += '<div class="cmpg"><span class="cmpl">' + esc(empNombre(r)) + '</span>';
    series.forEach(function (s) { var v = s[1][r]; if (v == null) return; h += '<div class="hbr"><span class="hbt"><i style="width:' + (v / max * 100).toFixed(1) + '%;background:' + s[2] + '"></i></span><b class="hbv">' + v.toFixed(1) + '%</b></div>'; });
    h += '</div>';
  });
  h += '<div class="leg">' + series.map(function (s) { return '<span><i style="background:' + s[2] + '"></i>' + esc(s[0]) + '</span>'; }).join('') + '</div>';
  return h + '</div>';
}
function donut(segs, size, center) {
  size = size || 132; var r = size / 2 - 12, c = 2 * Math.PI * r, tot = segs.reduce(function (s, x) { return s + x[1]; }, 0) || 1, off = 0;
  var h = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="Distribución"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--line3)" stroke-width="18"/>';
  segs.forEach(function (s) { var len = c * s[1] / tot; if (!len) return; h += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + s[2] + '" stroke-width="18" stroke-dasharray="' + Math.max(0, len - 2).toFixed(1) + ' ' + c.toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>'; off += len; });
  if (center) h += '<text x="50%" y="46%" text-anchor="middle" style="font:700 20px var(--disp);fill:var(--txt)">' + esc(center[0]) + '</text><text x="50%" y="62%" text-anchor="middle" style="font:500 11px var(--body);fill:var(--mut)">' + esc(center[1]) + '</text>';
  return h + '</svg>';
}

/* tarjeta de indicador con gráfica */
function kcard(k, compact) {
  var v = kpiVal(k), n = kpiNum(k), est = v ? k.est : 'gris';

/* ---------- panel general ---------- */
function fugaSums(list) {
  var ab = list.filter(function (x) { return x.est !== 'Cerrado'; });
  function sum(arr) { return arr.reduce(function (s, x) { return s + (x.monto || 0); }, 0); }

var CALC = {
  sueldo: function () {

    return '<h2>Puede retirar este mes</h2><div class="bigout">' + soles(ret) + '</div>' +
      outRow('Utilidad neta', soles(u)) + outRow('(−) Cuotas de deuda', soles(q)) + outRow('(−) Reinversión ' + r + '%', soles(u * r / 100)) + outRow('Disponible por utilidad', soles(Math.max(0, a)), true) +

  promo: function () {

function vAcad() {
  var c = C();
  var cls = DATA.academia.filter(function (x) { return c.areas.indexOf(x.area) >= 0 && (S.acadArea === 'Todas' || x.area === S.acadArea); });
  var h = vTop('Academia CORE', 'Capacitaciones para su equipo', 'Clases por área, ligadas a lo que se está implementando en su empresa. Programación propuesta: su líder de cuenta confirma las fechas con quienes marquen interés.');
  h += '<div class="chips">' + ['Todas'].concat(c.areas).map(function (a) { return '<button class="chipf' + (S.acadArea === a ? ' on' : '') + '" data-acarea="' + a + '">' + (a === 'Todas' ? 'Todas las áreas' : AREA_LBL[a]) + '</button>'; }).join('') + '</div><section class="grid g3">';
  cls.forEach(function (x, i) {
    var k = S.cli + '|' + x.t, on = !!L.interes[k];
    h += '<article class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between">' + apill(x.area) + '<span class="muted" style="font-size:12px">' + esc(x.modo) + ' · ' + esc(x.dur) + '</span></div><b style="font-size:15.5px;line-height:1.3">' + esc(x.t) + '</b><span class="muted" style="font-size:13px;line-height:1.5">' + esc(x.d) + '</span><span class="muted" style="font-size:12.5px">Dicta: ' + esc(x.prof) + ' · fecha por confirmar</span><div style="flex-grow:1"></div>' +
      '<button class="btn sm ' + (on ? 'line' : '') + '" data-int="' + esc(x.t) + '">' + (on ? 'Interés registrado · quitar' : 'Me interesa para mi equipo') + '</button></article>';
  });
  h += '</section>';
  return h;
}

/* ---------- render y eventos ---------- */
var VIEWS = { serv: vServ, analytics: vAnalytics, inicio: vInicio, ruta: vRuta, ind: vInd, fugas: vFugas, aprob: vAprob, check: vCheck, acad: vAcad };
function render() {
  var root = document.getElementById('root');
  if (!S.user) { root.innerHTML = vLogin(); bindLogin(); return; }
  root.innerHTML = '<div class="app' + (S.side ? '' : ' nos') + '" id="app">' + vSide() + '<main class="main">' + VIEWS[S.view]() + '</main></div>';
  bind();
}
function go(v) { if (v === 'serv') S.srv = null; S.view = v; document.getElementById('side') && document.getElementById('side').classList.remove('open'); render(); window.scrollTo(0, 0); }
function bind() {
  var root = document.getElementById('root');
  root.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function (e) { e.preventDefault(); var v = b.getAttribute('data-go'); if (v === 'aprob-sol') { S.aprobTab = 'sol'; v = 'aprob'; } go(v); }; });
  root.querySelectorAll('[data-ind]').forEach(function (b) { b.onclick = function (e) { e.preventDefault(); S.indArea = b.getAttribute('data-ind'); S.indSub = null; go('ind'); }; });
  root.querySelectorAll('[data-out]').forEach(function (b) { b.onclick = function () { S.user = null; render(); }; });
  root.querySelectorAll('[data-menu]').forEach(function (b) { b.onclick = function () {
    if (window.innerWidth <= 860) { document.getElementById('side').classList.toggle('open'); return; }
    S.side = !S.side; try { localStorage.setItem('core_side', S.side ? '1' : '0'); } catch (e) {}
    document.getElementById('app').classList.toggle('nos', !S.side); }; });
  root.querySelectorAll('[role=link][data-go],[role=link][data-ind]').forEach(function (b) { b.onkeydown = function (e) { if (e.key === 'Enter') b.click(); }; });
  var rs = document.getElementById('rucSel'); if (rs) rs.onchange = function () { S.ruc = rs.value; render(); };
  function each(sel, fn) { root.querySelectorAll(sel).forEach(function (b) { b.onclick = function (e) { e.preventDefault(); fn(b); render(); }; }); }
  each('[data-srv]', function (b) { S.srv = b.getAttribute('data-srv') || null; S.view = 'serv'; window.scrollTo(0, 0); });
  root.querySelectorAll('[data-calc] input,[data-calc] select').forEach(function (e) { e.oninput = runCalc; e.onchange = runCalc; });
  runCalc();
  root.querySelectorAll('[data-lev]').forEach(function (e) { e.oninput = recalcAn; });
  recalcAn();
  each('[data-rarea]', function (b) { S.rutaArea = b.getAttribute('data-rarea'); });
  each('[data-rvista]', function (b) { S.rutaVista = b.getAttribute('data-rvista'); });
  var rm = document.getElementById('rmap'); if (rm) rm.onchange = function () { S.roadmap = rm.checked; render(); };
  each('[data-isub]', function (b) { S.indSub = b.getAttribute('data-isub'); });
  each('[data-farea]', function (b) { S.fugaArea = b.getAttribute('data-farea'); });
  each('[data-atab]', function (b) { S.aprobTab = b.getAttribute('data-atab'); S.obsFor = null; });
  each('[data-carea]', function (b) { S.chkArea = b.getAttribute('data-carea'); });
  each('[data-cest]', function (b) { S.chkEst = b.getAttribute('data-cest'); });
  each('[data-acarea]', function (b) { S.acadArea = b.getAttribute('data-acarea'); });
  each('[data-int]', function (b) { var k = S.cli + '|' + b.getAttribute('data-int'); if (L.interes[k]) delete L.interes[k]; else { L.interes[k] = 1; toast('Interés registrado: su líder de cuenta le confirmará la fecha'); } persist(); });
  each('[data-obs]', function (b) { S.obsFor = b.getAttribute('data-obs'); });
  function decide(key, dec, com) {
    var p = porAprobar().filter(function (x) { return x.key === key; })[0]; if (!p) return;
    var now = new Date();
    L.decisiones[S.cli + '|' + key] = { t: p.t, dec: dec, com: com || '', por: S.user.nombre, ts: now.getTime(), fecha: fdc(now) + ' ' + now.getFullYear() + ' · ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') };
    persist(); S.obsFor = null; toast(dec === 'Aprobado' ? 'Aprobado · quedó en el historial' : 'Observación enviada a su líder de cuenta');
  }
  each('[data-apr]', function (b) { decide(b.getAttribute('data-apr'), 'Aprobado'); });
  root.querySelectorAll('[data-obsok]').forEach(function (b) { b.onclick = function () { var t = (document.getElementById('obsTxt').value || '').trim(); if (t.length < 3) { toast('Escriba qué debe corregirse'); return; } decide(b.getAttribute('data-obsok'), 'Observado', t); render(); }; });
  var sf = document.getElementById('solForm');
  if (sf) sf.onsubmit = function (e) {
    e.preventDefault();
    var txt = document.getElementById('sTxt').value.trim(); if (txt.length < 5) { toast('Describa su solicitud'); return; }
    var tp = document.getElementById('sTipo').value.split('|'), ruc = S.ruc;
    var n = Math.max.apply(null, [0].concat(C().solicitudes.map(function (s) { return s.n; })).concat(L.nuevasSol.filter(function (s) { return s.cli === S.cli; }).map(function (s) { return s.n; }))) + 1;
    L.nuevasSol.push({ cli: S.cli, ruc: ruc, n: n, fecha: iso(HOY), sol: txt, area: document.getElementById('sArea').value, tipo: tp[0], plazo: +tp[1], est: 'Abierta', atendida: null });
    persist(); toast('Solicitud #' + n + ' registrada'); render();
  };
  root.querySelectorAll('[data-up]').forEach(function (inp) { inp.onchange = function () { if (!inp.files.length) return; var now = new Date(); L.subidos[S.cli + '|' + inp.getAttribute('data-up')] = { nombre: inp.files[0].name, fecha: fdc(now) }; persist(); toast('Archivo enviado a revisión'); render(); }; });
  each('[data-undo]', function (b) { delete L.subidos[S.cli + '|' + b.getAttribute('data-undo')]; persist(); });
  var cq = document.getElementById('chkQ');
  if (cq) cq.oninput = function () { S.chkQ = cq.value; clearTimeout(cq._t); cq._t = setTimeout(function () { render(); var n = document.getElementById('chkQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
}
render();
</script>
</body>
</html>
