services:
  - type: web
    name: core-value-os-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # pega aqui la connection string de Neon
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: ALLOWED_ORIGINS
        sync: false # dominio del frontend en Cloudflare, ej: https://core-value-os-frontend.<subdominio>.workers.dev
