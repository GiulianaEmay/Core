services:
  - type: web
    name: core-value-os-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # pega aqui la connection string de Neon
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false # Frontend API URL de Clerk, ej: https://tu-instancia.clerk.accounts.dev
      - key: ALLOWED_ORIGINS
        sync: false # dominio del frontend en Vercel, ej: https://core-finq.vercel.app
